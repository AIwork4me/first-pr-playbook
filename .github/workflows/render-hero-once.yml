name: Render First PR Playbook Hero (one-time)
on:
  push:
    branches:
      - assets/add-first-pr-playbook-hero
permissions:
  contents: write
jobs:
  render-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: assets/add-first-pr-playbook-hero
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SVG renderer
        run: python -m pip install "CairoSVG==2.8.2"
      - name: Render and inspect PNG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          source = Path("assets/first-pr-playbook-hero.svg")
          target = Path("assets/first-pr-playbook-hero.png")
          cairosvg.svg2png(url=str(source),write_to=str(target))
          data=target.read_bytes()
          assert data.startswith(b"\x89PNG\r\n\x1a\n")
          assert data[16:24]==(1840).to_bytes(4,"big")+(800).to_bytes(4,"big")
          print(f"PNG OK: {len(data)} bytes at 1840 x 800")
          PY
      - name: Commit rendered binary into feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/first-pr-playbook-hero.png
          if git diff --cached --quiet; then
            echo "Image already current; nothing to commit"
          else
            git commit -m "assets: render README hero PNG from SVG source"
            git push origin HEAD:assets/add-first-pr-playbook-hero
          fi
